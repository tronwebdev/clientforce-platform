# INT W1 (DEC-093) live Slack proof: the owner's SLACK-BOT-TOKEN (Key Vault)
# seeds a token-based connection, then the REAL rails run against the REAL
# vendor — live auth.test probe, real channel list, a real chat.postMessage
# delivered through the REAL EventBus + notifier consumer, redelivery dedupe,
# the notify_team transport, the revoked-token honesty walk (corrupted copy,
# never the vault token), and the disconnect audit (vendor revoke SKIPPED —
# the bot token is shared infrastructure). Secrets masked; manual dispatch
# only. The dispatch becomes available once this yml is on the default branch
# (the DEC-066 GitHub limitation — the R1-UI proof precedent).
#
# The `walk` input selects which proof runs: `slack` (W1, the default — dispatch
# on the MAIN ref, which carries W1's slack-live-proof.ts), `calendly-demo`
# (W2's owner-demo link-tier walk) or `hubspot-demo` (W4's one-way CRM push).
# The non-slack walks are dispatched on the UNIT BRANCH ref.
name: integrations-live-proof

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type LIVE to confirm real Slack messages will post to the workspace channel"
        required: true
      channel:
        description: "Channel NAME to post to (optional — defaults to the first listed public channel)"
        required: false
      walk:
        description: "Which proof: slack · calendly-demo (W2) · calendly-staging-arm / -preflight / -verify / -frames (W2 staging ingress) · hubspot-demo (W4) · zapier (W5 rail)"
        required: false
        default: "slack"
      recipient:
        description: "calendly-demo only: the allow-listed inbox the REAL email delivers to"
        required: false
      calendly_link:
        description: "calendly walks: the real scheduling link (calendly-demo default https://calendly.com/clientforce/30min; the staging walks fall back to the PAT account's own scheduling_url)"
        required: false

permissions:
  id-token: write
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1
  DATABASE_URL: postgresql://postgres@localhost:5432/clientforce
  APP_DATABASE_URL: postgresql://clientforce_app@localhost:5432/clientforce
  REDIS_URL: redis://localhost:6379
  KEY_VAULT_NAME: ${{ vars.KEY_VAULT_NAME }}

jobs:
  proof:
    name: live Slack delivery · dedupe · notify_team · revoked honesty · disconnect audit
    # W1's slack-live-proof.ts lives on main (the split PRs) — dispatch the
    # slack walk on the MAIN ref. Gated to an EXACT slack match so a
    # calendly-demo or hubspot-demo dispatch never posts to the owner's Slack.
    if: ${{ github.event.inputs.walk == 'slack' }}
    runs-on: ubuntu-latest
    environment: staging
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: clientforce
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Refuse without explicit confirmation
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "LIVE" ]; then
            echo "::error::Dispatch input 'confirm' must be exactly LIVE — refusing to post real Slack messages."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @clientforce/integrations... build
      - run: pnpm --filter @clientforce/db db:migrate

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Run the live Slack proof (secrets masked)
        run: |
          set -euo pipefail
          bot="$(az keyvault secret show --vault-name "$KEY_VAULT_NAME" --name SLACK-BOT-TOKEN --query value -o tsv)"
          echo "::add-mask::$bot"
          FIELD_ENCRYPTION_KEY="$(az keyvault secret show --vault-name "$KEY_VAULT_NAME" --name FIELD-ENCRYPTION-KEY --query value -o tsv)"
          echo "::add-mask::$FIELD_ENCRYPTION_KEY"
          export FIELD_ENCRYPTION_KEY
          SLACK_BOT_TOKEN="$bot" SLACK_PROOF_CHANNEL="${{ github.event.inputs.channel }}" \
            pnpm exec tsx packages/integrations/scripts/slack-live-proof.ts

      - name: Upload receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slack-live-proof-receipts
          path: slack-live-proof-receipts.json

  # INT W2 (DEC-094) owner-demo, link tier: real link probe → real model
  # compose (grounded per-lead link) → REAL SendGrid delivery to the
  # allow-listed inbox. Detection is honestly flagged OUT (paid-tier token +
  # public ingress). Dispatch this walk ON THE UNIT BRANCH ref — the run uses
  # the branch's W2 code; main's registration makes it dispatchable (DEC-066).
  calendly-demo:
    name: W2 owner demo · real link probe · real compose · REAL email delivery
    if: ${{ github.event.inputs.walk == 'calendly-demo' }}
    runs-on: ubuntu-latest
    environment: staging
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: clientforce
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Refuse without explicit confirmation
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "LIVE" ]; then
            echo "::error::Dispatch input 'confirm' must be exactly LIVE — refusing to send a real email."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @clientforce/channels... --filter @clientforce/integrations... build
      - run: pnpm --filter @clientforce/db db:migrate

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Run the calendly demo walk (secrets masked)
        run: |
          set -euo pipefail
          sendgrid="$(az keyvault secret show --vault-name "$KEY_VAULT_NAME" --name SENDGRID-API-KEY --query value -o tsv)"
          echo "::add-mask::$sendgrid"
          anthropic="$(az keyvault secret show --vault-name "$KEY_VAULT_NAME" --name ANTHROPIC-API-KEY --query value -o tsv)"
          echo "::add-mask::$anthropic"
          FIELD_ENCRYPTION_KEY="$(az keyvault secret show --vault-name "$KEY_VAULT_NAME" --name FIELD-ENCRYPTION-KEY --query value -o tsv)"
          echo "::add-mask::$FIELD_ENCRYPTION_KEY"
          export FIELD_ENCRYPTION_KEY
          SENDGRID_API_KEY="$sendgrid" ANTHROPIC_API_KEY="$anthropic" \
          DEMO_RECIPIENT="${{ github.event.inputs.recipient }}" \
          DEMO_CALENDLY_LINK="${{ github.event.inputs.calendly_link }}" \
            pnpm exec tsx packages/integrations/scripts/calendly-demo-proof.ts

      - name: Upload receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calendly-demo-receipts
          path: calendly-demo-receipts.json

  # INT W4 (DEC-096) live HubSpot one-way CRM push: the vault HUBSPOT-DEMO-TOKEN
  # (a HubSpot Service Key — opaque bearer) connects through the REAL /account-info
  # probe, then a payment_received rule with create_crm_deal fires through the
  # REAL engine + crmTransport into api.hubapi.com — a real Contact + Deal,
  # idempotency (redelivery dedupes), the audit ledger, then update_deal_stage.
  # Dispatch ON THE UNIT BRANCH ref (DEC-066 — the workflow is registered on main).
  hubspot-demo:
    name: W4 live HubSpot · real contact + deal · idempotency · audit ledger · stage move
    if: ${{ github.event.inputs.walk == 'hubspot-demo' }}
    runs-on: ubuntu-latest
    environment: staging
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: clientforce
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Refuse without explicit confirmation
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "LIVE" ]; then
            echo "::error::Dispatch input 'confirm' must be exactly LIVE — refusing to create real HubSpot objects."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @clientforce/automations... --filter @clientforce/integrations... build
      - run: pnpm --filter @clientforce/db db:migrate

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Owner ask: flag any LEGACY HubSpot key still in the vault for removal
      # (a developer-account key from an earlier setup — unrelated, must NOT be
      # used or migrated). NAMES only (metadata) — no secret VALUES are ever
      # read here. Best-effort: never fails the proof (the identity may hold
      # Get but not List on the vault).
      - name: Flag any legacy HubSpot key in the vault (names only — never values)
        continue-on-error: true
        run: |
          echo "Auditing the vault for legacy HubSpot secrets (NAMES only; no values read)."
          if ! names="$(az keyvault secret list --vault-name "$KEY_VAULT_NAME" --query "[].name" -o tsv 2>/dev/null)"; then
            echo "::notice::Could not list vault secret names — the staging proof identity likely holds Get but not List. Owner: check the vault manually for a legacy HubSpot developer-account key to remove."
            exit 0
          fi
          hs="$(printf '%s\n' "$names" | grep -iE 'hubspot|hs[-_]|crm' || true)"
          if [ -n "$hs" ]; then echo "HubSpot-related secret names:"; printf '%s\n' "$hs" | sed 's/^/  - /'; else echo "No HubSpot-related secret names found."; fi
          legacy="$(printf '%s\n' "$hs" | grep -viE '^HUBSPOT-DEMO-TOKEN$' || true)"
          if [ -n "$legacy" ]; then
            echo "::warning::Legacy HubSpot secret(s) present besides HUBSPOT-DEMO-TOKEN — candidates for OWNER REMOVAL (this proof does NOT use or migrate them):"
            printf '%s\n' "$legacy" | sed 's/^/    FLAG-FOR-REMOVAL: /'
          else
            echo "::notice::Clean — no legacy HubSpot secret beyond HUBSPOT-DEMO-TOKEN."
          fi

      - name: Run the HubSpot live proof (secrets masked)
        # The vault key is a `pat-eu1-` token (an EU data-residency portal). The
        # adapter DERIVES the regional host from the prefix (api-eu1.hubapi.com —
        # HYPHEN; the api.hubapi.com facade defaults EU tokens to the US hublet →
        # 401), so the proof exercises that path; HUBSPOT_BASE_URL is set as the
        # documented fallback the owner requested (a portal moving region only
        # needs this env, no code change).
        env:
          HUBSPOT_BASE_URL: https://api-eu1.hubapi.com
        run: |
          set -euo pipefail
          token="$(az keyvault secret show --vault-name "$KEY_VAULT_NAME" --name HUBSPOT-DEMO-TOKEN --query value -o tsv)"
          echo "::add-mask::$token"
          FIELD_ENCRYPTION_KEY="$(az keyvault secret show --vault-name "$KEY_VAULT_NAME" --name FIELD-ENCRYPTION-KEY --query value -o tsv)"
          echo "::add-mask::$FIELD_ENCRYPTION_KEY"
          export FIELD_ENCRYPTION_KEY
          HUBSPOT_DEMO_TOKEN="$token" \
            pnpm exec tsx packages/integrations/scripts/hubspot-live-proof.ts

      - name: Upload receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hubspot-live-proof-receipts
          path: hubspot-live-proof-receipts.json

  # INT W5 (DEC-101): the Zapier rail. There is no external vendor to call —
  # Zapier authenticates to US — so this proves OUR rail on real Postgres + RLS:
  # key resolution, TENANT ISOLATION, polling the persisted Event log, the
  # inbound writes, and the refusal paths. No Key Vault secrets are needed, so
  # this job takes no vault read at all.
  zapier:
    name: W5 Zapier rail · key auth · tenant isolation · poll · writes · refusals
    if: ${{ github.event.inputs.walk == 'zapier' }}
    runs-on: ubuntu-latest
    environment: staging
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: clientforce
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @clientforce/integrations... build
      - run: pnpm --filter @clientforce/db db:migrate

      - name: Run the Zapier rail proof
        run: pnpm exec tsx packages/integrations/scripts/zapier-live-proof.ts

      - name: Upload receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zapier-live-proof-receipts
          path: zapier-live-proof-receipts.json

  # ── INT W2 (DEC-094) · the STAGING-INGRESS booking walk (owner ruling
  #    2026-07-29). The `calendly-demo` walk above proves the LINK tier with an
  #    ephemeral CI Postgres. These two walks prove the DETECTION tier for real:
  #    the subscription is created BY the deployed staging API, pointing at that
  #    API's own public ingress, so Calendly delivers genuine webhooks into a
  #    running service. The owner books (and reschedules) against the real
  #    scheduling link between the two dispatches.
  #
  #    `arm`    — PAT probe → connect the token tier on staging (server-minted
  #               signing key + capability token, REAL subscription create) →
  #               list it back from the vendor → print what to book.
  #    `verify` — assert what the genuine deliveries wrote, run the replay-only
  #               proofs (tampered / redelivery / out-of-order — none of which a
  #               vendor can be asked to perform, all labelled `replayed`), then
  #               delete the subscription and list it gone.
  #
  #    The staging DB is opened READ-ONLY for inspection; every asserted row was
  #    written by the deployed API off a real delivery.
  calendly-staging:
    name: W2 staging ingress · real PAT · real subscription · real deliveries
    # NOT startsWith: 'calendly-staging-frames' is its own job, and a prefix
    # match made a frames dispatch silently re-run the arm walk too.
    if: ${{ github.event.inputs.walk == 'calendly-staging-arm' || github.event.inputs.walk == 'calendly-staging-preflight' || github.event.inputs.walk == 'calendly-staging-verify' }}
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Refuse without explicit confirmation
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "LIVE" ]; then
            echo "::error::Dispatch input 'confirm' must be exactly LIVE — this walk creates a REAL Calendly webhook subscription against deployed staging."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Builds the prisma client too (db build = prisma generate). NOTE: this
      # walk NEVER runs db:migrate — staging's schema is owned by the deploy.
      - run: pnpm --filter @clientforce/integrations... build

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # The load-bearing ingress step: Calendly can only deliver if the API
      # registered its OWN public https base as the callback. bicep takes it as
      # `integrationsWebhookBase` (wired into deploy.yml alongside this walk);
      # this step makes the running revision match without waiting for a deploy,
      # and is a no-op once it does.
      - name: Ensure INTEGRATIONS_WEBHOOK_BASE points at the staging API
        id: ingress
        env:
          RG: ${{ vars.AZURE_RESOURCE_GROUP }}
        run: |
          set -euo pipefail
          api_fqdn="$(az containerapp show --name clientforce-api --resource-group "$RG" \
            --query "properties.configuration.ingress.fqdn" -o tsv)"
          [ -n "$api_fqdn" ] || { echo "::error::could not resolve the staging api FQDN"; exit 1; }
          want="https://$api_fqdn"
          echo "api=$want" >> "$GITHUB_OUTPUT"
          have="$(az containerapp show --name clientforce-api --resource-group "$RG" \
            --query "properties.template.containers[0].env[?name=='INTEGRATIONS_WEBHOOK_BASE'].value | [0]" -o tsv)"
          if [ "$have" = "$want" ]; then
            echo "::notice::INTEGRATIONS_WEBHOOK_BASE already $want"
          else
            echo "::notice::setting INTEGRATIONS_WEBHOOK_BASE=$want (was '${have:-unset}')"
            az containerapp update --name clientforce-api --resource-group "$RG" \
              --set-env-vars "INTEGRATIONS_WEBHOOK_BASE=$want" >/dev/null
          fi
          echo "waiting for the api revision to answer /healthz…"
          for i in $(seq 1 40); do
            code="$(curl -sS -o /dev/null -w '%{http_code}' "$want/healthz" || true)"
            [ "$code" = "200" ] && { echo "api healthy after ${i} tries"; exit 0; }
            sleep 6
          done
          echo "::error::staging api never answered /healthz at $want"; exit 1

      - name: Run the staging-ingress walk (secrets masked)
        env:
          PHASE: ${{ github.event.inputs.walk == 'calendly-staging-verify' && 'verify' || github.event.inputs.walk == 'calendly-staging-preflight' && 'preflight' || 'arm' }}
          STAGING_API_URL: ${{ steps.ingress.outputs.api }}
          CALENDLY_SCHEDULING_URL: ${{ github.event.inputs.calendly_link }}
        run: |
          set -euo pipefail
          pat="$(az keyvault secret show --vault-name "$KEY_VAULT_NAME" --name CALENDLY-DEMO-TOKEN --query value -o tsv)"
          echo "::add-mask::$pat"
          dev="$(az keyvault secret show --vault-name "$KEY_VAULT_NAME" --name AUTH-DEV-SECRET --query value -o tsv)"
          echo "::add-mask::$dev"
          dburl="$(az keyvault secret show --vault-name "$KEY_VAULT_NAME" --name DATABASE-URL --query value -o tsv)"
          echo "::add-mask::$dburl"
          FIELD_ENCRYPTION_KEY="$(az keyvault secret show --vault-name "$KEY_VAULT_NAME" --name FIELD-ENCRYPTION-KEY --query value -o tsv)"
          echo "::add-mask::$FIELD_ENCRYPTION_KEY"
          export FIELD_ENCRYPTION_KEY
          CALENDLY_API_TOKEN="$pat" AUTH_DEV_SECRET="$dev" STAGING_DATABASE_URL="$dburl" \
          OUT_FILE="calendly-staging-${PHASE}-receipts.json" \
            pnpm exec tsx packages/integrations/scripts/calendly-staging-proof.ts

      - name: Upload receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calendly-staging-receipts
          path: calendly-staging-*-receipts.json

  # ── INT W2 (DEC-103) · the §8 LIVE frames from DEPLOYED STAGING. The booking
  #    behind every surface was written by the deployed API off a REAL Calendly
  #    delivery, so these are staging-ingress frames, not local-stack ones.
  #    Capture is assertion-gated (see the spec): a mis-navigation fails the run
  #    instead of producing a plausible but worthless image. Frames are uploaded
  #    as an artifact; committing them into docs/fidelity/int-w2/live/ is a
  #    deliberate human step, so a green run can never silently rewrite evidence.
  calendly-staging-frames:
    name: W2 staging ingress · §8 live frames (1440x900 vs deployed staging)
    if: ${{ github.event.inputs.walk == 'calendly-staging-frames' }}
    runs-on: ubuntu-latest
    environment: staging
    # A capture job must never sit burning a runner: without this a hung apt
    # step inside `playwright install --with-deps` stalls until the 6h default.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # NO --with-deps: that variant shells out to apt-get, which hung
      # indefinitely on two consecutive runners. The earlier successful runs
      # took ~25s for the same step, i.e. apt had nothing to do — ubuntu-latest
      # already ships the shared libs Chromium needs, so the browser binary
      # alone is enough and avoids the apt path entirely. The timeout stays as
      # a backstop rather than the remedy.
      - run: pnpm --filter @clientforce/e2e exec playwright install chromium
        timeout-minutes: 6

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve the staging web FQDN
        id: web
        env:
          RG: ${{ vars.AZURE_RESOURCE_GROUP }}
        run: |
          set -euo pipefail
          web="$(az containerapp show --name clientforce-web --resource-group "$RG" \
            --query "properties.configuration.ingress.fqdn" -o tsv)"
          [ -n "$web" ] || { echo "::error::could not resolve the staging web FQDN"; exit 1; }
          echo "url=https://$web" >> "$GITHUB_OUTPUT"
          echo "web: https://$web"

      - name: Capture the live frames
        env:
          E2E_BASE_URL: ${{ steps.web.outputs.url }}
        run: pnpm --filter @clientforce/e2e exec playwright test int-w2-staging-frames

      - name: Upload frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: int-w2-live-frames
          path: docs/fidelity/int-w2/live/*.png
